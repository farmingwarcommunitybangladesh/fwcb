<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FWCB - Admin Control Panel</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Admin Specific Custom Styling - Premium Responsive Gaming Theme */
        .admin-body {
            padding: 10px;
            max-width: 750px;
            margin: 0 auto;
            box-sizing: border-box;
        }
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            max-width: 400px;
            margin: 80px auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-top: 3px solid var(--gaming-cyan);
            box-sizing: border-box;
        }
        .login-card h2 {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            margin-top: 0;
            color: #fff;
            font-size: 18px;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.5px;
        }
        .form-control {
            width: 100%;
            background: #161b22;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 12px;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: var(--gaming-cyan);
            outline: none;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }
        select.form-control option {
            background: var(--bg-card);
            color: #fff;
        }
        .admin-btn {
            font-family: 'Orbitron', sans-serif;
            width: 100%;
            background: var(--gaming-cyan);
            color: #06090e;
            border: none;
            padding: 11px;
            border-radius: 6px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
            transition: all 0.2s;
        }
        .admin-btn:hover {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 15px;
            gap: 10px;
        }
        .panel-header h2 {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            font-size: 16px;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }
        .logout-btn {
            font-family: 'Orbitron', sans-serif;
            background: #ff007f;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 800;
            font-size: 10px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        
        /* FIXED: নতুন গেমিং ট্যাব নেভিগেশন বার */
        .admin-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            background: #10141c;
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .tab-trigger {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 5px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            border-radius: 6px;
            text-transform: uppercase;
            transition: all 0.2s;
            text-align: center;
        }
        .tab-trigger.active {
            background: var(--gaming-cyan);
            color: #06090e;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }
        
        /* ট্যাব কন্টেন্ট মডিউল */
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        .action-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        .action-card h3 {
            font-family: 'Orbitron', sans-serif;
            margin-top: 0;
            color: var(--gaming-cyan);
            font-size: 14px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }
        
        .form-grid-layout, .form-split-layout {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(100%, 1fr)); 
            gap: 12px;
        }
        
        /* ডেক্সটপ উইন্ডোর জন্য গ্রিড রেশিও পরিবর্তন */
        @media (min-width: 550px) {
            .form-grid-layout { grid-template-columns: repeat(2, 1fr); }
            .form-split-layout { grid-template-columns: repeat(2, 1fr); }
            .tab-trigger { font-size: 12px; }
            .panel-header h2 { font-size: 20px; }
        }

        /* টেবিল রেসপনসিভ কন্টেইনার */
        .clan-table-wrapper {
            overflow-x: auto;
            width: 100%;
            -webkit-overflow-scrolling: touch;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }
        .admin-clan-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            color: var(--text-primary);
            min-width: 480px;
        }
        .admin-clan-table th, .admin-clan-table td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .admin-clan-table th {
            background: #161b22;
            color: var(--gaming-cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 0.5px;
        }
        
        .btn-table {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            margin-right: 3px;
            transition: 0.2s;
            text-transform: uppercase;
        }
        .btn-edit { background: #0284c7; color: #fff; }
        .btn-delete { background: #ff007f; color: #fff; }

        .alert-error {
            color: #ff007f;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            display: none;
            font-family: 'Orbitron', sans-serif;
        }
    </style>
</head>
<body class="admin-body">

    <div id="login-layer">
        <div class="login-card">
            <h2>FWCB Control Login</h2>
            <div class="form-group">
                <label>ADMIN SECURITY EMAIL</label>
                <input type="email" id="login-email" class="form-control" placeholder="admin@fwcb.com">
            </div>
            <div class="form-group">
                <label>ENCRYPTED PASSWORD</label>
                <input type="password" id="login-password" class="form-control" placeholder="••••••••">
            </div>
            <button class="admin-btn" id="btn-login">Verify Identity</button>
            <div id="login-error" class="alert-error">Invalid Security Credentials</div>
        </div>
    </div>

    <div id="admin-panel-layer" style="display: none;">
        <header class="panel-header">
            <h2>FWCB Admin Console</h2>
            <button class="logout-btn" id="btn-logout">Logout</button>
        </header>

        <nav class="admin-tabs">
            <button class="tab-trigger active" onclick="switchAdminTab('tab-config', this)">⚙️ Config</button>
            <button class="tab-trigger" id="form-tab-btn" onclick="switchAdminTab('tab-form', this)">➕ Add Clan</button>
            <button class="tab-trigger" onclick="switchAdminTab('tab-manifest', this)">📋 Manifest</button>
        </nav>

        <div id="tab-config" class="tab-content active">
            <div class="action-card">
                <h3>Global Directory Settings</h3>
                <div class="form-group">
                    <label>ORDER CLANS BY:</label>
                    <select id="setting-sort" class="form-control" style="margin-bottom: 12px;" onchange="renderAdminTable()">
                        <option value="name">Alphabetical Name (A-Z)</option>
                        <option value="level">Highest Clan Level</option>
                        <option value="category">Category Alliance</option>
                    </select>
                    <button class="admin-btn" id="btn-save-settings">Apply Config To Website</button>
                </div>
            </div>
        </div>

        <div id="tab-form" class="tab-content">
            <div class="action-card">
                <h3 id="form-title">Register New Alliance</h3>
                <input type="hidden" id="editing-doc-id" value="">

                <form id="clan-register-form" onsubmit="return false;">
                    <div class="form-grid-layout">
                        <div class="form-group">
                            <label>CLAN NAME</label>
                            <input type="text" id="clan-name" class="form-control" required placeholder="e.g. Evil Army">
                        </div>
                        <div class="form-group">
                            <label>CLAN IN-GAME TAG</label>
                            <input type="text" id="clan-tag" class="form-control" required placeholder="e.g. #2G0JRQV0C">
                        </div>
                        <div class="form-group">
                            <label>ALLIANCE ALLOCATION</label>
                            <select id="clan-cat" class="form-control">
                                <option value="FWA">FWA Clan</option>
                                <option value="GFL">GFL Clan</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>CLAN LEVEL</label>
                            <input type="number" id="clan-level" class="form-control" required placeholder="e.g. 15">
                        </div>
                        <div class="form-group">
                            <label>CAPITAL HALL TIER</label>
                            <select id="clan-capital" class="form-control">
                                <option value="1">Level 1</option><option value="2">Level 2</option><option value="3">Level 3</option><option value="4">Level 4</option><option value="5">Level 5</option><option value="6">Level 6</option><option value="7">Level 7</option><option value="8">Level 8</option><option value="9">Level 9</option><option value="10">Level 10</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>CWL LEAGUE RANK</label>
                            <select id="clan-cwl" class="form-control">
                                <option value="Unranked">Unranked</option><option value="Bronze League III">Bronze League III</option><option value="Bronze League II">Bronze League II</option><option value="Bronze League I">Bronze League I</option><option value="Silver League III">Silver League III</option><option value="Silver League II">Silver League II</option><option value="Silver League I">Silver League I</option><option value="Gold League III">Gold League III</option><option value="Gold League II">Gold League II</option><option value="Gold League I">Gold League I</option><option value="Crystal League III">Crystal League III</option><option value="Crystal League II">Crystal League II</option><option value="Crystal League I">Crystal League I</option><option value="Master League III">Master League III</option><option value="Master League II">Master League II</option><option value="Master League I">Master League I</option><option value="Champion League III">Champion League III</option><option value="Champion League II">Champion League II</option><option value="Champion League I">Champion League I</option><option value="Titan League III">Titan League III</option><option value="Titan League II">Titan League II</option><option value="Titan League I">Titan League I</option><option value="Legend League">Legend League</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group" style="margin-top: 5px;">
                        <label>BADGE URL (Postimages Direct Link)</label>
                        <input type="url" id="clan-badge" class="form-control" placeholder="Paste link here...">
                    </div>
                    <div class="form-split-layout">
                        <div class="form-group">
                            <label>IN-GAME DIRECT SHARE LINK</label>
                            <input type="url" id="clan-link" class="form-control" placeholder="https://link.clashofclans.com/...">
                        </div>
                        <div class="form-group">
                            <label>LEADER FB PROFILE LINK</label>
                            <input type="url" id="clan-leader-fb" class="form-control" placeholder="https://facebook.com/...">
                        </div>
                    </div>
                    <button class="admin-btn" id="btn-save-clan" style="margin-top: 5px;">Save Clan Matrix</button>
                </form>
            </div>
        </div>

        <div id="tab-manifest" class="tab-content">
            <div class="action-card">
                <h3>Global Alliance Manifest</h3>
                <div class="clan-table-wrapper">
                    <table class="admin-clan-table">
                        <thead>
                            <tr>
                                <th>Clan Name</th>
                                <th>Tag</th>
                                <th>Level</th>
                                <th>Category</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="panel-clans-tbody">
                            <tr>
                                <td colspan="5" style="text-align: center; color: var(--text-muted);">Synchronizing fields...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBbOO6txw7yHsTUdVabM46thHXHgAvIu2U",
            authDomain: "fwcb-official-portal.firebaseapp.com",
            projectId: "fwcb-official-portal",
            storageBucket: "fwcb-official-portal.firebasestorage.app",
            messagingSenderId: "731121018316",
            appId: "1:731121018316:web:d11b8f3a540679c2fd2969"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginLayer = document.getElementById('login-layer');
        const adminLayer = document.getElementById('admin-panel-layer');
        const loginErr = document.getElementById('login-error');

        let localClansArray = [];

        // ফ্রন্টঅ্যান্ড ট্যাব সুইচিং মাস্টার লজিক
        window.switchAdminTab = function(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.querySelectorAll('.tab-trigger').forEach(tab => tab.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginLayer.style.display = 'none';
                adminLayer.style.display = 'block';
                loadSavedSortConfig();
                syncAdminDashboard();
            } else {
                loginLayer.style.display = 'block';
                adminLayer.style.display = 'none';
            }
        });

        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value;
            loginErr.style.display = 'none';

            if(!email || !pass) return;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) {
                console.error(err);
                loginErr.style.display = 'block';
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth);
            location.reload();
        });

        async function loadSavedSortConfig() {
            try {
                const configSnap = await getDoc(doc(db, "fwcb_settings", "sorting"));
                if(configSnap.exists()) {
                    document.getElementById('setting-sort').value = configSnap.data().orderBy || 'name';
                }
            } catch(e) { console.error(e); }
        }

        document.getElementById('btn-save-settings').addEventListener('click', async () => {
            const sortVal = document.getElementById('setting-sort').value;
            try {
                await setDoc(doc(db, "fwcb_settings", "sorting"), { 
                    orderBy: sortVal,
                    updatedAt: new Date().getTime()
                });
                alert(`Success! Website layout is now sorted by: ${sortVal.toUpperCase()}`);
            } catch (e) {
                console.error(e);
                alert("Matrix write operation fault.");
            }
        });

        document.getElementById('btn-save-clan').addEventListener('click', async () => {
            const form = document.getElementById('clan-register-form');
            if(!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const docId = document.getElementById('editing-doc-id').value;
            const payload = {
                name: document.getElementById('clan-name').value.trim(),
                tag: document.getElementById('clan-tag').value.trim().toUpperCase(),
                category: document.getElementById('clan-cat').value,
                level: document.getElementById('clan-level').value,
                capitalLevel: document.getElementById('clan-capital').value,
                cwlLeague: document.getElementById('clan-cwl').value,
                badgeUrl: document.getElementById('clan-badge').value.trim(),
                clanLink: document.getElementById('clan-link').value.trim(),
                leaderFb: document.getElementById('clan-leader-fb').value.trim()
            };

            try {
                if(docId) {
                    await updateDoc(doc(db, "fwcb_clans", docId), payload);
                    alert("Clan Profile updated successfully!");
                } else {
                    await addDoc(collection(db, "fwcb_clans"), payload);
                    alert("New Clan Profile committed successfully!");
                }
                resetFormState();
                syncAdminDashboard();
                
                // সেভ করার পর অটোমেটিক Manifest ট্যাবে নিয়ে যাবে দেখার জন্য
                document.querySelectorAll('.tab-trigger')[2].click();
            } catch (e) {
                console.error(e);
                alert("Cloud deployment rejected.");
            }
        });

        async function syncAdminDashboard() {
            try {
                const snap = await getDocs(collection(db, "fwcb_clans"));
                localClansArray = [];
                snap.forEach(docSnap => {
                    localClansArray.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderAdminTable();
            } catch (e) {
                console.error(e);
            }
        }

        window.renderAdminTable = function() {
            const tbody = document.getElementById('panel-clans-tbody');
            const sortBy = document.getElementById('setting-sort').value;
            tbody.innerHTML = '';

            if(localClansArray.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No active clans found.</td></tr>';
                return;
            }

            let sorted = [...localClansArray];
            if (sortBy === 'name') {
                sorted.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            } else if (sortBy === 'level') {
                sorted.sort((a, b) => Number(b.level || 0) - Number(a.level || 0));
            } else if (sortBy === 'category') {
                sorted.sort((a, b) => (a.category || '').localeCompare(b.category || ''));
            }

            sorted.forEach(clan => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong style="color:#fff;">${clan.name || 'Unnamed'}</strong></td>
                    <td><span style="color:var(--gaming-cyan); font-family:monospace;">${clan.tag || 'N/A'}</span></td>
                    <td>Lv ${clan.level || '0'}</td>
                    <td><span class="cat-badge cat-${(clan.category || 'FWA').toLowerCase()}">${clan.category || 'FWA'}</span></td>
                    <td>
                        <button class="btn-table btn-edit" onclick="triggerEditMode('${clan.id}')">Edit</button>
                        <button class="btn-table btn-delete" onclick="deleteClanRecord('${clan.id}')">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.triggerEditMode = function(id) {
            const clan = localClansArray.find(c => c.id === id);
            if(!clan) return;

            document.getElementById('editing-doc-id').value = clan.id;
            document.getElementById('clan-name').value = clan.name || '';
            document.getElementById('clan-tag').value = clan.tag || '';
            document.getElementById('clan-cat').value = clan.category || 'FWA';
            document.getElementById('clan-level').value = clan.level || '';
            document.getElementById('clan-capital').value = clan.capitalLevel || '1';
            document.getElementById('clan-cwl').value = clan.cwlLeague || 'Unranked';
            document.getElementById('clan-badge').value = clan.badgeUrl || '';
            document.getElementById('clan-link').value = clan.clanLink || '';
            document.getElementById('clan-leader-fb').value = clan.leaderFb || '';

            document.getElementById('form-title').innerText = "Modify Clan Document";
            document.getElementById('btn-save-clan').innerText = "Update Clan Record";
            
            // এডিটে চাপ দিলে অটোমেটিক ২ নম্বর "Add Clan" ফর্ম ট্যাবে চলে যাবে
            document.getElementById('form-tab-btn').click();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.deleteClanRecord = async function(id) {
            if(!confirm("Are you sure you want to purge this document?")) return;
            try {
                await deleteDoc(doc(db, "fwcb_clans", id));
                alert("Data record successfully wiped.");
                syncAdminDashboard();
            } catch (e) {
                alert("Purge operation faulted: " + e.message);
            }
        }

        function resetFormState() {
            document.getElementById('clan-register-form').reset();
            document.getElementById('editing-doc-id').value = '';
            document.getElementById('form-title').innerText = "Register New Alliance";
            document.getElementById('btn-save-clan').innerText = "Save Clan Matrix";
        }
    </script>
</body>
</html>
